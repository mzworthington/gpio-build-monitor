<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build monitor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-status="NONE">
  <div class="atmosphere" aria-hidden="true"></div>
  <main>
    <header class="masthead">
      <img class="brand-mark" src="/logo.svg" width="64" height="64" alt="">
      <h1>Build monitor</h1>
      <p class="tagline">CI you notice without looking for it - on the web or glowing on your desk.</p>
      <a
        class="repo-link"
        href="https://github.com/mzworthington/gpio-build-monitor"
        rel="noopener noreferrer"
        target="_blank"
      >
        <svg class="repo-icon" viewBox="0 0 16 16" aria-hidden="true" width="16" height="16">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.77c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
        Open source on GitHub
      </a>
      <p id="connection" class="connection" data-state="connecting">Connecting…</p>
      <p
        id="last-checked"
        class="last-checked"
        data-last-checked-at=""
      >Not checked yet</p>
      <div id="push-controls" class="push-controls" hidden>
        <button type="button" id="push-toggle" class="push-toggle" data-state="off">
          Notify on failure
        </button>
        <p id="push-hint" class="push-hint"></p>
      </div>
    </header>

    <section class="hero">
      <div
        class="status-dial"
        id="status-dial"
        data-status="NONE"
        data-poll-seconds="30"
        data-next-check-at=""
        data-fetching="false"
      >
        <svg class="status-dial-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="status-dial-track" cx="50" cy="50" r="46"></circle>
          <circle
            class="status-dial-progress"
            id="ticker-progress"
            cx="50"
            cy="50"
            r="46"
            pathLength="1"
          ></circle>
        </svg>
        <div class="status-dial-core">
          <p id="status-word" class="status-word">Idle</p>
          <p id="summary" class="summary">Waiting for status…</p>
        </div>
      </div>
    </section>

    <div class="lights" aria-label="Signal lights" aria-live="polite">
      <div class="light" data-light="blue" title="Fetching">
        <span class="bulb"></span>
        <span class="label">Fetch</span>
      </div>
      <div class="light" data-light="green" title="Pass">
        <span class="bulb"></span>
        <span class="label">Pass</span>
      </div>
      <div class="light" data-light="yellow" title="Running">
        <span class="bulb"></span>
        <span class="label">Run</span>
      </div>
      <div class="light" data-light="red" title="Fail">
        <span class="bulb"></span>
        <span class="label">Fail</span>
      </div>
      <div class="light" data-light="purple" title="Connection error">
        <span class="bulb"></span>
        <span class="label">Error</span>
      </div>
    </div>


    <section id="issues" class="issues" aria-label="Attention" hidden>
      <div class="issues-head">
        <h2>Needs attention</h2>
        <p id="issue-count" class="issue-count"></p>
      </div>
      <ul id="issue-list"></ul>
    </section>
    
    <section id="repos" class="repos" aria-label="Watched repositories" hidden>
      <div class="repos-head">
        <h2>Repos</h2>
        <p id="repo-count" class="repo-count"></p>
      </div>
      <ul id="repo-list"></ul>
    </section>
  </main>
  <footer class="site-credit">
    <p>
      Made by
      <a href="https://mzworthington.co.uk" rel="noopener noreferrer">Matthew Z Worthington</a>
    </p>
  </footer>
  <script src="/countdown.js"></script>
  <script src="/app.js"></script>
  <script src="/push.js"></script>
</body>
</html>
