name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Do not cancel an in-flight main release when another push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  align:
    name: Waykit align
    # Pin uses:/kit_ref to a vX.Y.Z tag once that Waykit release should freeze.
    uses: mzworthington/waykit/.github/workflows/align-consumer.yml@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Bootstrap
        run: make bootstrap

      - name: Test
        run: make test

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit/test-results.xml
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect application changes since last release
        id: changes
        run: |
          git fetch --tags --force
          if ! git describe --tags --match 'v*' --abbrev=0 >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "No previous release tag found; release required."
            exit 0
          fi

          last_tag="$(git describe --tags --match 'v*' --abbrev=0)"
          if git diff --quiet "${last_tag}" HEAD -- monitor/ pyproject.toml; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No application changes since ${last_tag}."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Application changes detected since ${last_tag}."
          fi

      - name: Install mise
        if: steps.changes.outputs.release == 'true'
        uses: jdx/mise-action@v4

      - name: Bootstrap
        if: steps.changes.outputs.release == 'true'
        run: make bootstrap

      - name: Release
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git describe --tags --match 'v*' >/dev/null 2>&1; then
            VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            git tag "v${VERSION}"
            echo "Seeded baseline tag v${VERSION} from pyproject.toml"
          fi
          print_log="$(.venv/bin/semantic-release version --print 2>&1 || true)"
          printf '%s\n' "$print_log"
          if printf '%s\n' "$print_log" | grep -qiE 'No release will be made|No release will be created'; then
            echo "No semantic-release version to cut; skipping publish."
            exit 0
          fi
          .venv/bin/semantic-release version
          git fetch origin main
          git pull --ff-only origin main
          # `version` builds dist/ and creates the GitHub Release; `publish` uploads
          # the wheel/sdist assets that bin/update installs on the Pi.
          .venv/bin/semantic-release publish

  deploy-worker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: worker
        run: pnpm test

      - name: Typecheck
        working-directory: worker
        run: pnpm typecheck

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
        run: |
          if [ -n "${POSTHOG_TOKEN:-}" ]; then
            printf '%s' "$POSTHOG_TOKEN" | pnpm exec wrangler secret put POSTHOG_TOKEN --name gpio-build-monitor
          fi
          pnpm deploy

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: worker
        run: pnpm test

      - name: Typecheck
        working-directory: worker
        run: pnpm typecheck
