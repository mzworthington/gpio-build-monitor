name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Do not cancel an in-flight main release when another push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  align:
    name: Waykit align
    # Pin uses:/kit_ref to a vX.Y.Z tag once that Waykit release should freeze.
    uses: mzworthington/waykit/.github/workflows/align-consumer.yml@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify
        uses: mzworthington/dotfiles/.github/actions/python-mise-verify@main

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_API_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.organization=${{ vars.SONARQUBE_ORG }}

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect application changes since last release
        id: changes
        uses: mzworthington/dotfiles/.github/actions/detect-release-changes@main
        with:
          paths: |
            monitor/api/
            pyproject.toml

      - name: Install mise
        if: steps.changes.outputs.release == 'true'
        uses: jdx/mise-action@v4

      - name: Bootstrap
        if: steps.changes.outputs.release == 'true'
        run: make bootstrap

      - name: Release
        if: steps.changes.outputs.release == 'true'
        uses: mzworthington/dotfiles/.github/actions/python-semantic-release@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-web-pnpm

      - name: Test
        working-directory: monitor/device/web
        run: pnpm test

      - name: Typecheck
        working-directory: monitor/device/web
        run: pnpm typecheck

      - name: Deploy Pages
        working-directory: monitor/device/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MONITOR_API_ORIGIN: ${{ vars.MONITOR_API_ORIGIN }}
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
          POSTHOG_HOST: https://a.mzworthington.co.uk
        run: pnpm deploy

  deploy-api:
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-web-pnpm

      - name: Build Alpine UI
        working-directory: monitor/device/web
        run: pnpm build:web

      - name: Deploy API Worker
        working-directory: monitor/device/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON_API_ORIGIN: ${{ vars.PYTHON_API_ORIGIN }}
        run: pnpm exec wrangler deploy --var PYTHON_API_ORIGIN:${PYTHON_API_ORIGIN}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-web-pnpm

      - name: Test
        working-directory: monitor/device/web
        run: pnpm test

      - name: Typecheck
        working-directory: monitor/device/web
        run: pnpm typecheck

      - name: Build Alpine UI
        working-directory: monitor/device/web
        run: pnpm build:web

  eink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Native duty-cycle tests
        run: make test-eink
