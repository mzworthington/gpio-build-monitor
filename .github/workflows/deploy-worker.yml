name: Deploy Worker

# Hosted UI + WebSocket at monitor.mzworthington.co.uk.
# Pulumi owns the Worker identity / custom domain; this job publishes script + assets.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'monitor/web/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: worker
        run: pnpm typecheck

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy
