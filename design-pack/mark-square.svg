  <circle cx="64" cy="10" r="22" fill="url(#wash-blue)"/>
  <circle cx="115.4" cy="47.3" r="22" fill="url(#wash-green)"/>
  <circle cx="95.7" cy="107.7" r="22" fill="url(#wash-yellow)"/>
  <circle cx="32.3" cy="107.7" r="22" fill="url(#wash-red)"/>
  <circle cx="12.6" cy="47.3" r="22" fill="url(#wash-purple)"/>
  <circle cx="64" cy="10" r="11" fill="#6aa8ff"/>
  <circle cx="61.7" cy="7.5" r="3.5" fill="#e8f1ff" opacity="0.9"/>
  <circle cx="115.4" cy="47.3" r="11" fill="#3dd68c"/>
  <circle cx="113.1" cy="44.8" r="3.5" fill="#e6fff2" opacity="0.9"/>
  <circle cx="95.7" cy="107.7" r="11" fill="#efc15a"/>
  <circle cx="93.4" cy="105.2" r="3.5" fill="#fff6d6" opacity="0.9"/>
  <circle cx="32.3" cy="107.7" r="11" fill="#ff6b6b"/>
  <circle cx="30" cy="105.2" r="3.5" fill="#ffe0e0" opacity="0.9"/>
  <circle cx="12.6" cy="47.3" r="11" fill="#c084fc"/>
  <circle cx="10.3" cy="44.8" r="3.5" fill="#f5e8ff" opacity="0.9"/>
