  <rect width="128" height="128" fill="#000000"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#1c2430" stroke-width="9"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#3dd68c" stroke-width="9"
