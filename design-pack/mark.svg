<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Build monitor">
  <defs>
    <radialGradient id="wash-blue" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6aa8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6aa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-green" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3dd68c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3dd68c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-yellow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#efc15a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#efc15a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-red" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-purple" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0b0e13"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#1c2430" stroke-width="7"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#3dd68c" stroke-width="7"
