  <!-- glow washes -->
  <circle cx="64" cy="20" r="18" fill="url(#wash-blue)"/>
  <circle cx="104" cy="48" r="18" fill="url(#wash-green)"/>
  <circle cx="90" cy="98" r="18" fill="url(#wash-yellow)"/>
  <circle cx="38" cy="98" r="18" fill="url(#wash-red)"/>
  <circle cx="24" cy="48" r="18" fill="url(#wash-purple)"/>
  <!-- bulbs -->
  <circle cx="64" cy="20" r="8.5" fill="#6aa8ff"/>
  <circle cx="62.2" cy="18" r="2.8" fill="#e8f1ff" opacity="0.9"/>
  <circle cx="104" cy="48" r="8.5" fill="#3dd68c"/>
  <circle cx="102.2" cy="46" r="2.8" fill="#e6fff2" opacity="0.9"/>
  <circle cx="90" cy="98" r="8.5" fill="#efc15a"/>
  <circle cx="88.2" cy="96" r="2.8" fill="#fff6d6" opacity="0.9"/>
  <circle cx="38" cy="98" r="8.5" fill="#ff6b6b"/>
  <circle cx="36.2" cy="96" r="2.8" fill="#ffe0e0" opacity="0.9"/>
  <circle cx="24" cy="48" r="8.5" fill="#c084fc"/>
  <circle cx="22.2" cy="46" r="2.8" fill="#f5e8ff" opacity="0.9"/>
