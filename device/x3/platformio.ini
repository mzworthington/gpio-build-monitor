[env:xteink-x3]
; Arduino 3.1.3 + matching RISC-V toolchain (darwin_arm64). Do not overlay
; GCC 13 onto Arduino 2.0.17 — that fails to link `_cleanup_r`.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
; Homebrew PlatformIO 6.2 fails pioarduino esptool's postinstall script.
platform_packages =
  platformio/tool-esptoolpy@~2.41100.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Native USB CDC. Without this, PIO often picks /dev/cu.Bluetooth-Incoming-Port.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
  zinggjm/GxEPD2@^1.5.9
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_ESP_TASK_WDT_INIT=0
